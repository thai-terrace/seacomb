# An x86_64 guest, which covers Arch::X86_64 and Arch::X86.

base:
- common.yaml
- template:_images/debian-13

arch: x86_64

provision:
# The 32-bit libraries the i686 target links against.
- mode: system
  script: |
    #!/bin/bash
    set -eux -o pipefail
    export DEBIAN_FRONTEND=noninteractive
    apt-get install -y gcc-multilib
    "${CARGO_HOME}/bin/rustup" target add i686-unknown-linux-gnu
