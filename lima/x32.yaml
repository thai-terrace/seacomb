# A Debian guest, which covers Arch::X32.
#
# Ubuntu builds its kernel without CONFIG_X86_X32_ABI at all, and so does the
# Debian cloud kernel this image boots; only Debian's generic kernel carries the
# ABI, and builds it with CONFIG_X86_X32_DISABLED, so the ABI appears once that
# kernel runs with `syscall.x32=1` on its command line, which takes a restart
# after the first start.

base:
- common.yaml
- template:_images/debian-13

arch: x86_64

provision:
# The x32 libraries the gnux32 target links against.
- mode: system
  script: |
    #!/bin/bash
    set -eux -o pipefail
    export DEBIAN_FRONTEND=noninteractive
    apt-get install -y gcc-multilib libc6-dev-x32
    "${CARGO_HOME}/bin/rustup" target add x86_64-unknown-linux-gnux32
# The generic kernel, which is the only Debian flavor built with the x32 ABI.
- mode: system
  script: |
    #!/bin/bash
    set -eux -o pipefail
    export DEBIAN_FRONTEND=noninteractive
    apt-get install -y linux-image-amd64
    # The cloud kernel goes, so that grub's default entry is the generic one.
    apt-get purge -y 'linux-image-*-cloud-amd64' linux-image-cloud-amd64
# The kernel command line that turns the x32 ABI on, for the next boot to pick up.
- mode: system
  script: |
    #!/bin/bash
    set -eux -o pipefail
    if ! grep -q "syscall.x32=1" /etc/default/grub; then
      echo 'GRUB_CMDLINE_LINUX="${GRUB_CMDLINE_LINUX} syscall.x32=1"' >>/etc/default/grub
      update-grub
    fi
