name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04
            target: i686-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Install 32-bit linker
        if: matrix.target == 'i686-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib

      - name: Test
        run: cargo test --locked --target ${{ matrix.target }}

      - name: Clippy
        run: cargo clippy --locked --all-targets --target ${{ matrix.target }} -- -D warnings

  qemu:
    name: QEMU tests (macOS)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Install QEMU
        run: brew install qemu
      - name: Test all architectures
        run: python3 tests/run.py

  proofs:
    name: Verify proofs
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      VERUS_VERSION: 0.2026.09.20.aef82ed
    steps:
      - uses: actions/checkout@v6

      - name: Install Verus
        run: |
          curl -fL --retry 3 -o "$RUNNER_TEMP/verus.zip" \
            "https://github.com/verus-lang/verus/releases/download/release/${VERUS_VERSION}/verus-${VERUS_VERSION}-x86-linux.zip"
          unzip -q "$RUNNER_TEMP/verus.zip" -d "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/verus-x86-linux/"{verus,cargo-verus,z3}
          echo "$RUNNER_TEMP/verus-x86-linux" >> "$GITHUB_PATH"
          rustup component add rustc-dev llvm-tools

      - name: Verify
        run: cargo verus verify --locked --check-toolchain
